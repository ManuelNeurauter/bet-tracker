<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Order allow,deny
        Allow from all
    </Directory>

    <Directory /var/www/html>
        AllowOverride All
        Order allow,deny
        Allow from all
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/betledger-error.log
    CustomLog ${APACHE_LOG_DIR}/betledger-access.log combined
</VirtualHost>
